app:
  security:
    jwt-secret: "jwt-tokens-that-should-be-changed-production"
    jwt-expiration-minutes: 30
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/educeasy_db?useSSL=false&serverTimezone=UTC
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQL8Dialect
      hibernate.format_sql: true
      hibernate.show_sql: false
server:
  port: 4700

logging.level.org.springframework.security: INFO
